<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIDECO ONLINE TEST CENTER – PSSP</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root { 
      --navy: #102742; 
      --ink: #172b43; 
      --blue: #1765ac; 
      --muted: #60758d; 
      --line: #dce5ee; 
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "DM Sans", sans-serif; color: var(--ink); background: #f6f8fb; }
    .hero { background: var(--navy); position: relative; overflow: hidden; }
    .hero::after { 
      content: ""; 
      position: absolute; 
      width: 370px; 
      height: 370px; 
      right: -90px; 
      top: -180px; 
      border: 1px solid rgba(255,255,255,.13); 
      border-radius: 50%; 
      box-shadow: 0 0 0 70px rgba(255,255,255,.025), 0 0 0 145px rgba(255,255,255,.018); 
      pointer-events: none; 
    }
    .brand-rule { width: 43px; height: 4px; background: #59a9e8; border-radius: 8px; }
    .filter-button { border: 1px solid var(--line); background: white; color: #405671; transition: all .2s; }
    .filter-button:hover { border-color: var(--blue); color: var(--blue); }
    .filter-button.active { background: var(--blue) !important; border-color: var(--blue); color: white !important; }
    .test-card { background: #fff; border: 1px solid var(--line); transition: all .2s; }
    .test-card:hover { border-color: #a7c5dd; box-shadow: 0 12px 28px rgba(16,39,66,.07); transform: translateY(-2px); }
    .test-number { color: var(--blue); background: #eaf3fb; }
    .start-button { background: var(--blue); color: white; transition: background .2s; }
    .start-button:not(:disabled):hover { background: #104c85; }
    .start-button:disabled { background: #edf1f5 !important; color: #8494a6 !important; cursor: not-allowed; }
  </style>
</head>
<body class="w-full min-h-screen">
  <header class="hero w-full">
    <div class="relative z-10 max-w-6xl mx-auto px-5 sm:px-8 pt-10 pb-12 sm:pt-14 sm:pb-16">
      <div class="brand-rule mb-7" aria-hidden="true"></div>
      <p class="uppercase tracking-[.18em] mb-3 text-sky-300 font-bold text-xs">PELAYANAN SAFETY SATU PINTU (PSSP)</p>
      <h1 class="font-extrabold leading-tight max-w-3xl text-white text-3xl sm:text-5xl">KIDECO TEST </h1>
      <p class="mt-4 max-w-2xl leading-relaxed text-slate-200 text-base sm:text-lg">Portal Akses Tes Induksi KIDECO</p>
      
      <div class="flex flex-wrap gap-3 mt-9">
        <div class="rounded-xl px-5 py-3 border border-white/20 bg-slate-800/60">
          <strong id="stat-total-tests" class="block text-white font-extrabold text-2xl">22</strong>
          <span class="block text-slate-300 text-xs">Total jenis tes</span>
        </div>
        <div class="rounded-xl px-5 py-3 border border-white/20 bg-slate-800/60">
          <strong id="stat-total-cats" class="block text-white font-extrabold text-2xl">4</strong>
          <span class="block text-slate-300 text-xs">Total kategori tes</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 sm:px-8 py-9 sm:py-12">
        <section aria-labelledby="directory-title">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <p class="uppercase tracking-[.16em] mb-1 text-blue-600 font-bold text-xs">DIREKTORI TES</p>
          <h2 id="directory-title" class="font-bold text-slate-900 text-2xl sm:text-3xl">Temukan tes yang Anda butuhkan</h2>
        </div>
        <p id="results-count" class="text-sm font-semibold text-slate-500" aria-live="polite"></p>
      </div>

      <label for="test-search" class="block font-semibold mb-2 text-slate-800 text-sm">Cari tes</label>
      <div class="relative mb-6">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
        </svg>
        <input id="test-search" class="w-full rounded-xl border border-slate-300 bg-white py-3.5 pl-12 pr-4 shadow-sm focus:outline-none focus:border-blue-500 text-slate-800 text-base" type="search" placeholder="Cari nama tes atau jenis unit...">
      </div>

      <!-- Filter Buttons -->
      <nav id="filter-container" aria-label="Filter kategori tes" class="flex flex-wrap gap-2 mb-7">
        <button type="button" data-category="all" class="filter-button active rounded-full px-4 py-2 text-sm font-semibold">Semua Tes</button>
        <button type="button" data-category="induksi" class="filter-button rounded-full px-4 py-2 text-sm font-semibold">Induksi</button>
        <button type="button" data-category="Sarana" class="filter-button rounded-full px-4 py-2 text-sm font-semibold">Sarana</button>
        <button type="button" data-category="A2B" class="filter-button rounded-full px-4 py-2 text-sm font-semibold">A2B</button>
        <button type="button" data-category="Evaluasi pengawas" class="filter-button rounded-full px-4 py-2 text-sm font-semibold">Evaluasi pengawas</button>
             </nav>

      <!-- Container Tes -->
      <div id="test-list" class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
        <!-- Render via JavaScript -->
      </div>
    </section>
  </main>

  <script>
    // SEMUA DATA TES DIJADIKAN SATU DI SINI
    const TEST_DATA = [
      // Induksi & sarana
      { id: 1, name: "Induksi K3 Kideco", catKey: "induksi", category: "Induksi", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=8d9551dc-3df2-46ce-81cd-b4a7bce4f17b" },
      { id: 2, name: "Light Vehicle", catKey: "Sarana", category: "Sarana", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=5e345dc8-14ef-4253-858e-c6b98f24dd71" },
      { id: 3, name: "Bus", catKey: "Sarana", category: "Sarana", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=8a9853c3-baf7-4a1a-b7aa-541389cc1037" },

    
      { id: 4, name: "Water Truck (WT)", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=3a18a619-fc78-4382-8a99-6e9f9fd61383" },
      { id: 5, name: "Fuel Truck", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=28d42775-83d6-4e14-87b0-748e9f3e03d3" },
      { id: 6, name: "Dozer", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=f20206a4-0dd3-4fde-a7c4-6b0e4cd83001" },
      { id: 7, name: "Dump Truck", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=c88b4f97-44bd-4333-81e5-a475fdce33a2" },

      { id: 8, name: "Excavator", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=2c5e4a22-feb5-4845-967c-c0cfd7b461f4" },
      { id: 9, name: "OHC", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=bacc5576-3617-4a1a-a4d8-1a8232f5b17f" },
      { id: 10, name: "Motor Grader", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=517a2f15-2095-47f8-af1f-068cacb999f6" },
      { id: 11, name: "Wheel Loader", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=8efad459-469e-4fd1-92ec-89a617f7a97c" },
      { id: 12, name: "Compactor", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=2749a592-3a7f-4a0c-8b2b-3cb8b76f1f20" },
      { id: 13, name: "Crane,MC", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=ef89a525-ef7c-49d6-851b-5e01a32476f4" },
      { id: 14, name: "HD", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=168a5c61-e15e-4d0f-9fcd-037f4d65c465" },
      { id: 15, name: "Forklift", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=0fcf6667-3416-4d8e-bbee-ffd27860a3c8" },
      { id: 16, name: "Lowboy", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=b18c6639-0b47-491b-a965-01258906b370" },

      // Unit Khusus
      { id: 17, name: "Trailer", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=8e0a63d5-4f8a-4f47-bade-bf9ca5b474d7" },
      { id: 18, name: "Manhaul", catKey: "Sarana", category: "Sarana", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=57ff30bd-470f-4cbe-92c9-78cb88ac29bb" },
      { id: 19, name: "DT-WB", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=0c7669ab-6bd4-47fe-ba95-9ed5d30e7543" },
      { id: 20, name: "DM", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=554afcc1-4c5c-404a-930f-32fa9706b36a" },
      { id: 21, name: "Umum(LT/ST,LubTruck)", catKey: "A2B", category: "A2B", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=54ac586b-b856-4282-9f51-b9546dd8f728" },
      { id: 22, name: "Evaluasi Operasional Pengawas Tipe A", catKey: "Evaluasi pengawas", category: "Evaluasi pengawas", url: "https://nembayu.kideco.co.id/TrainingExternal/CreateTrainingData?trainingTemplateID=cc6c5f9f-b42e-4737-b3b2-ff2e60755b93" },
 
    ];

    let currentCategory = "all";
    let searchQuery = "";

    const testListEl = document.getElementById("test-list");
    const searchInput = document.getElementById("test-search");
    const filterButtons = document.querySelectorAll("#filter-container button");
    const resultsCountEl = document.getElementById("results-count");

    function renderTests() {
      const filtered = TEST_DATA.filter(item => {
        const matchCategory = currentCategory === "all" || item.catKey === currentCategory;
        const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            item.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCategory && matchSearch;
      });

      resultsCountEl.textContent = `Menampilkan ${filtered.length} dari ${TEST_DATA.length} tes`;

      if (filtered.length === 0) {
        testListEl.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-xl border border-slate-200">
            <p class="text-slate-500 font-semibold">Tidak ada tes yang sesuai dengan pencarian atau filter Anda.</p>
          </div>
        `;
        return;
      }

      testListEl.innerHTML = filtered.map(item => {
        const numFormatted = String(item.id).padStart(2, '0');
        const hasUrl = item.url && item.url.trim() !== "";
        
        return `
          <article class="test-card rounded-xl p-5">
            <div class="flex gap-4">
              <span class="test-number shrink-0 w-10 h-10 rounded-lg flex items-center justify-center font-bold text-sm">${numFormatted}</span>
              <div class="min-w-0 flex-1">
                <h3 class="font-bold leading-snug text-slate-800 text-base">${item.name}</h3>
                <p class="mt-1 text-xs text-slate-500">${item.category}</p>
                <div class="flex flex-wrap items-center justify-between gap-3 mt-5">
                  ${hasUrl 
                    ? `<span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">LINK TERSEDIA</span>
                       <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="start-button rounded-lg px-4 py-2 text-xs font-bold tracking-wide inline-block text-center">MULAI TES</a>`
                    : `<span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-1 rounded">LINK BELUM TERSEDIA</span>
                       <button type="button" class="start-button rounded-lg px-4 py-2 text-xs font-bold tracking-wide" disabled>MULAI TES</button>`
                  }
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderTests();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => {
          b.classList.remove("active");
          b.setAttribute("aria-pressed", "false");
        });
        btn.classList.add("active");
        btn.setAttribute("aria-pressed", "true");
        currentCategory = btn.getAttribute("data-category");
        renderTests();
      });
    });

    renderTests();
  </script>
</body>
</html>
